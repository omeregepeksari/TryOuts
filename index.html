<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BoxLogic — Push Crates, Think Ahead</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      background: #1a1d2e;
      font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
      color: #eef;
      overflow: hidden;
    }
#wrap {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100%; padding: 12px;
      width: 100%;
    }
    h1 {
      margin: 0 0 4px 0;
      font-size: 2em;
      letter-spacing: 0.12em;
      background: linear-gradient(180deg, #ffd166, #f4845f);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    #sub { color: #9aa; font-size: 0.85em; margin-bottom: 10px; text-align: center; }
    #stage {
      position: relative;
      background: #23273f;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.05);
      max-width: 95vw; width: 480px;
    }
    #hud {
      display: flex; justify-content: space-between; align-items: center;
      width: 100%; margin-bottom: 10px; font-size: 0.95em; color: #bcd;
    }
    #hud .stat { margin-right: 18px; }
    #hud .val { color: #ffd166; font-weight: bold; }
    canvas { display: block; border-radius: 6px; background: #14162a; max-width: 100%; height: auto; touch-action: none; }
    #controls {
      display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; justify-content: center;
    }
    button {
      background: linear-gradient(180deg, #3a3f66, #2b2f52);
      color: #eef; border: 1px solid rgba(255,255,255,0.1);
      padding: 8px 16px; border-radius: 8px; font-size: 0.9em;
      cursor: pointer; font-family: inherit;
      transition: transform 0.08s, background 0.15s;
    }
    button:hover { background: linear-gradient(180deg, #4a5080, #3a3f66); }
    button:active { transform: scale(0.95); }
    button.primary { background: linear-gradient(180deg, #ffd166, #f4845f); color: #221; font-weight: bold; }
    button.primary:hover { filter: brightness(1.08); }
    #levelSelect {
      display: none;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      max-width: 420px;
      margin-top: 10px;
    }
    #levelSelect button {
      padding: 10px 0; font-weight: bold;
    }
    #levelSelect button.done { background: linear-gradient(180deg, #6fcf97, #3fa768); color: #123; }
    #levelSelect button.locked { opacity: 0.35; cursor: not-allowed; }
    #difficultyWrap { display: none; align-items: center; gap: 6px; }
    #difficultyWrap label { font-size: 0.85em; color: #9aa; }
    #difficultyWrap select {
      background: #14162a; color: #eef; border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px; padding: 8px 10px; font-family: inherit; font-size: 0.9em;
    }
    #toast {
      position: absolute; top: -46px; left: 50%; transform: translateX(-50%);
      background: #ffd166; color: #221; padding: 8px 18px; border-radius: 20px;
      font-weight: bold; font-size: 0.9em; opacity: 0; transition: all 0.3s;
      pointer-events: none; white-space: nowrap; z-index: 10;
    }
    #toast.show { opacity: 1; top: -60px; }
    #legend { margin-top: 10px; font-size: 0.78em; color: #789; text-align: center; line-height: 1.6; }
    /* modals */
    #lbBtn { margin-left: 6px; }
    .modalOverlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      align-items: center; justify-content: center;
      z-index: 50;
    }
    .modalOverlay.show { display: flex; }
    .modalBox {
      background: #23273f;
      border-radius: 14px;
      padding: 22px;
      width: min(340px, 88vw);
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }
    .modalBox h2 { margin: 0 0 6px 0; color: #ffd166; }
    .modalBox p { color: #aab; font-size: 0.9em; margin: 4px 0 14px 0; }
    .modalBox input {
      width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15);
      background: #14162a; color: #eef; font-size: 1em; margin-bottom: 12px; box-sizing: border-box;
    }
    .modalBox .row { display: flex; gap: 8px; justify-content: flex-end; }
    #lbList { list-style: none; margin: 0; padding: 0; max-height: 340px; overflow-y: auto; }
    #lbList li {
      display: flex; justify-content: space-between; padding: 8px 4px;
      border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 0.92em;
    }
    #lbList li:first-child { color: #ffd166; font-weight: bold; }
    #lbStatus { font-size: 0.85em; color: #89a; text-align: center; padding: 10px 0; }
  </style>
</head>
<body>
<div id="wrap">
  <h1>BOXLOGIC</h1>
  <div id="sub">Push every crate onto a target. No timers, no reflexes — just think.</div>
  <div id="stage">
    <div id="toast"></div>
    <div id="hud">
      <div>
        <span class="stat">Level <span class="val" id="lvlNum">1</span>/<span id="lvlTotal"></span></span>
        <span class="stat">Moves: <span class="val" id="moveCount">0</span></span>
        <span class="stat">Pushes: <span class="val" id="pushCount">0</span></span>
      </div>
      <div>Best: <span class="val" id="bestMoves">—</span></div>
    </div>
    <canvas id="board"></canvas>

    <div id="controls">
      <button id="undoBtn">↩ Undo (Z)</button>
      <button id="resetBtn">⟲ Reset (R)</button>
      <button id="hintBtn">💡 Hint</button>
      <button id="levelsBtn">☰ Levels</button>
      <button id="endlessBtn">🎲 Endless</button>
      <span id="difficultyWrap">
        <label for="difficultySelect">Difficulty:</label>
        <select id="difficultySelect">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
        </select>
        <button id="rerollBtn">🔄 Reroll</button>
      </span>
      <button id="lbBtn">🏆 Leaderboard</button>
      <button class="primary" id="nextBtn" style="display:none">Next Level →</button>
    </div>
    <div id="levelSelect"></div>
    <div id="legend">Arrow keys / WASD or swipe to move · Push crates 📦 onto targets ✦ · Z to undo · R to reset</div>
  </div>
</div>

<!-- Name entry modal -->
<div class="modalOverlay" id="nameModal">
  <div class="modalBox">
    <h2>You beat BoxLogic! 🏆</h2>
    <p id="finalScoreLine"></p>
    <input id="nameInput" maxlength="16" placeholder="Enter your name">
    <div class="row">
      <button id="skipSubmit">Skip</button>
      <button class="primary" id="submitScore">Submit Score</button>
    </div>
  </div>
</div>

<!-- Leaderboard modal -->
<div class="modalOverlay" id="lbModal">
  <div class="modalBox">
    <h2>Leaderboard</h2>
    <p>Lowest total moves to clear all levels</p>
    <div id="lbStatus">Loading…</div>
    <ol id="lbList"></ol>
    <div class="row" style="margin-top:12px">
      <button id="closeLb">Close</button>
    </div>
  </div>
</div>

<!-- External level data -->
<script src="levels.js"></script>
<script src="generator.js"></script>

<script>
  const TILE = 46;
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');

  let grid = [];         // 'wall' | 'floor' | 'void'
  let targets = [];      // boolean grid
  let crates = [];       // {x, y}
  let player = { x: 0, y: 0 };
  let rows = 0, cols = 0;
  let history = [];      // stack of {crates, player, moves, pushes}
  let moves = 0, pushes = 0;
  let currentLevel = 0;
  let bestByLevel = {};
  let solvedByLevel = {};
  let mode = 'classic';        // 'classic' | 'endless'
  let endlessDifficulty = 'medium';
  let endlessCount = 0;
  let currentGenLevel = null;

  // ---------- Parsing ----------
  function parseLevel(str) {
    const lines = str.split('\n').filter(l => l.length > 0);
    rows = lines.length;
    cols = Math.max(...lines.map(l => l.length));
    grid = []; targets = []; crates = [];
    player = { x: 0, y: 0 }; // default, will be overwritten

    for (let y = 0; y < rows; y++) {
      const line = lines[y];
      const gRow = [], tRow = [];
      for (let x = 0; x < cols; x++) {
        const ch = line[x] || ' ';
        let isWall = ch === '#';
        let isTarget = false;
        if (ch === '.' || ch === '+' || ch === '*') isTarget = true;
        if (ch === '@' || ch === '+') { player = { x, y }; }
        if (ch === '$' || ch === '*') { crates.push({ x, y }); }
        gRow.push(isWall ? 'wall' : (ch === ' ' ? 'void' : 'floor'));
        tRow.push(isTarget);
      }
      grid.push(gRow);
      targets.push(tRow);
    }
  }

  function loadLevel(idx) {
    mode = 'classic';
    currentLevel = idx;
    parseLevel(LEVELS[idx]);
    history = [];
    moves = 0; pushes = 0;
    canvas.width = cols * TILE;
    canvas.height = rows * TILE;
    updateHUD();
    document.getElementById('nextBtn').style.display = 'none';
    document.getElementById('nextBtn').textContent = 'Next Level →';
    document.getElementById('difficultyWrap').style.display = 'none';
    draw();
  }

  function loadGeneratedLevel(str) {
    mode = 'endless';
    parseLevel(str);
    history = [];
    moves = 0; pushes = 0;
    canvas.width = cols * TILE;
    canvas.height = rows * TILE;
    updateHUD();
    document.getElementById('nextBtn').style.display = 'none';
    document.getElementById('nextBtn').textContent = 'New Level →';
    document.getElementById('difficultyWrap').style.display = 'inline-flex';
    draw();
  }

  function newEndlessLevel(difficulty) {
    if (difficulty) endlessDifficulty = difficulty;
    currentGenLevel = generateLevel(endlessDifficulty);
    loadGeneratedLevel(currentGenLevel);
  }

  // ---------- Helpers ----------
  function isWall(x, y) {
    return !grid[y] || grid[y][x] === 'wall' || grid[y][x] === undefined;
  }
  function crateAt(x, y) {
    return crates.find(c => c.x === x && c.y === y);
  }
  function isTarget(x, y) {
    return targets[y] && targets[y][x];
  }

  function snapshot() {
    return {
      crates: crates.map(c => ({ ...c })),
      player: { ...player },
      moves, pushes
    };
  }

  // ---------- Movement ----------
  function tryMove(dx, dy) {
    const nx = player.x + dx, ny = player.y + dy;
    if (isWall(nx, ny)) return;
    const crate = crateAt(nx, ny);
    if (crate) {
      const bx = nx + dx, by = ny + dy;
      if (isWall(bx, by) || crateAt(bx, by)) return; // blocked
      history.push(snapshot());
      crate.x = bx; crate.y = by;
      player.x = nx; player.y = ny;
      moves++; pushes++;
    } else {
      history.push(snapshot());
      player.x = nx; player.y = ny;
      moves++;
    }
    updateHUD();
    draw();
    checkWin();
  }

  function undo() {
    if (!history.length) return;
    const s = history.pop();
    crates = s.crates;
    player = s.player;
    moves = s.moves;
    pushes = s.pushes;
    updateHUD();
    draw();
  }

  function resetLevel() {
    if (mode === 'endless') loadGeneratedLevel(currentGenLevel);
    else loadLevel(currentLevel);
  }

  // ---------- Win condition ----------
  function checkWin() {
    const solved = crates.every(c => isTarget(c.x, c.y));
    if (!solved) return;

    if (mode === 'endless') {
      endlessCount++;
      updateHUD();
      showToast(`Solved in ${moves} moves! 🎉`);
      document.getElementById('nextBtn').textContent = 'New Level →';
      document.getElementById('nextBtn').style.display = 'inline-block';
      return;
    }

    solvedByLevel[currentLevel] = true;
    if (!bestByLevel[currentLevel] || moves < bestByLevel[currentLevel]) {
      bestByLevel[currentLevel] = moves;
    }
    updateHUD();
    showToast(`Solved in ${moves} moves! 🎉`);
    document.getElementById('nextBtn').style.display = currentLevel < LEVELS.length - 1 ? 'inline-block' : 'none';

    const allSolved = LEVELS.every((_, i) => solvedByLevel[i]);
    if (allSolved) {
      const total = LEVELS.reduce((sum, _, i) => sum + (bestByLevel[i] || 0), 0);
      setTimeout(() => showFinalScore(total), 1200);
    }
  }

  // ---------- Leaderboard ----------
  function showFinalScore(total) {
    document.getElementById('finalScoreLine').textContent =
      `All ${LEVELS.length} levels cleared in ${total} total moves. Submit your score?`;
    document.getElementById('nameModal').classList.add('show');
  }
  document.getElementById('skipSubmit').onclick = () => {
    document.getElementById('nameModal').classList.remove('show');
  };
  document.getElementById('submitScore').onclick = async () => {
    const name = document.getElementById('nameInput').value.trim() || 'Anonymous';
    const total = LEVELS.reduce((sum, _, i) => sum + (bestByLevel[i] || 0), 0);
    document.getElementById('nameModal').classList.remove('show');
    if (typeof window.submitScore === 'function') {
      showToast('Submitting score…');
      try {
        await window.submitScore(name, total);
        showToast('Score submitted! 🎉');
      } catch (e) {
        showToast('Could not submit — check Firebase setup.');
      }
    } else {
      showToast('Leaderboard not configured.');
    }
    openLeaderboard();
  };

  function openLeaderboard() {
    document.getElementById('lbModal').classList.add('show');
    refreshLeaderboard();
  }
  async function refreshLeaderboard() {
    const statusEl = document.getElementById('lbStatus');
    const listEl = document.getElementById('lbList');
    listEl.innerHTML = '';
    if (typeof window.loadLeaderboard !== 'function') {
      statusEl.textContent = 'Leaderboard not configured yet.';
      return;
    }
    statusEl.textContent = 'Loading…';
    try {
      const rows = await window.loadLeaderboard();
      if (!rows.length) { statusEl.textContent = 'No scores yet — be the first!'; return; }
      statusEl.textContent = '';
      rows.forEach((r, i) => {
        const li = document.createElement('li');
        li.innerHTML = `<span>#${i+1} ${r.name}</span><span>${r.totalMoves} moves</span>`;
        listEl.appendChild(li);
      });
    } catch (e) {
      statusEl.textContent = 'Could not load leaderboard — check Firebase setup.';
    }
  }
  document.getElementById('lbBtn').onclick = openLeaderboard;
  document.getElementById('closeLb').onclick = () => document.getElementById('lbModal').classList.remove('show');

  // ---------- Toast ----------
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  // ---------- HUD ----------
  function updateHUD() {
    if (mode === 'endless') {
      document.getElementById('lvlNum').textContent = endlessCount + 1;
      document.getElementById('lvlTotal').textContent = '∞';
      document.getElementById('bestMoves').textContent = '—';
    } else {
      document.getElementById('lvlNum').textContent = currentLevel + 1;
      document.getElementById('lvlTotal').textContent = LEVELS.length;
      document.getElementById('bestMoves').textContent = bestByLevel[currentLevel] ?? '—';
    }
    document.getElementById('moveCount').textContent = moves;
    document.getElementById('pushCount').textContent = pushes;
  }

  // ---------- Rendering ----------
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const px = x * TILE, py = y * TILE;
        const cell = grid[y][x];
        if (cell === 'void') continue;
        if (cell === 'wall') {
          ctx.fillStyle = '#3a3f5c';
          ctx.fillRect(px, py, TILE, TILE);
          ctx.strokeStyle = 'rgba(0,0,0,0.25)';
          ctx.strokeRect(px + 1, py + 1, TILE - 2, TILE - 2);
          ctx.fillStyle = 'rgba(255,255,255,0.04)';
          ctx.fillRect(px + 4, py + 4, TILE - 8, 6);
        } else {
          ctx.fillStyle = (x + y) % 2 === 0 ? '#181b30' : '#1c1f38';
          ctx.fillRect(px, py, TILE, TILE);
          if (targets[y][x]) {
            ctx.strokeStyle = '#ffd166';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(px + TILE / 2, py + TILE / 2, TILE * 0.22, 0, Math.PI * 2);
            ctx.stroke();
            ctx.fillStyle = 'rgba(255,209,102,0.25)';
            ctx.fill();
          }
        }
      }
    }

    // crates
    crates.forEach(c => {
      const px = c.x * TILE, py = c.y * TILE;
      const onTarget = isTarget(c.x, c.y);
      ctx.fillStyle = onTarget ? '#6fcf97' : '#d98a4f';
      ctx.strokeStyle = onTarget ? '#3fa768' : '#a5602c';
      ctx.lineWidth = 3;
      roundRect(px + 5, py + 5, TILE - 10, TILE - 10, 6);
      ctx.fill(); ctx.stroke();
      ctx.strokeStyle = 'rgba(0,0,0,0.2)';
      ctx.lineWidth = 1;
      ctx.strokeRect(px + 11, py + 11, TILE - 22, TILE - 22);
    });

    // player
    const pxp = player.x * TILE, pyp = player.y * TILE;
    ctx.fillStyle = '#7cc4ff';
    ctx.beginPath();
    ctx.arc(pxp + TILE / 2, pyp + TILE / 2, TILE * 0.32, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#1a1d2e';
    ctx.beginPath();
    ctx.arc(pxp + TILE / 2 - 6, pyp + TILE / 2 - 4, 3.5, 0, Math.PI * 2);
    ctx.arc(pxp + TILE / 2 + 6, pyp + TILE / 2 - 4, 3.5, 0, Math.PI * 2);
    ctx.fill();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // ---------- Hint ----------
  function hint() {
    const stray = crates.find(c => !isTarget(c.x, c.y));
    if (!stray) { showToast('Everything is already placed!'); return; }
    let nearest = null, best = Infinity;
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
      if (targets[y] && targets[y][x] && !crateAt(x, y)) {
        const d = Math.abs(x - stray.x) + Math.abs(y - stray.y);
        if (d < best) { best = d; nearest = { x, y }; }
      }
    }
    if (!nearest) { showToast('Think about which target needs this crate.'); return; }
    const dx = nearest.x - stray.x, dy = nearest.y - stray.y;
    const dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
    showToast(`Try moving a crate ${dir} — nearest empty target is that way.`);
  }

  // ---------- Level select ----------
  function buildLevelSelect() {
    const el = document.getElementById('levelSelect');
    el.innerHTML = '';
    LEVELS.forEach((_, i) => {
      const b = document.createElement('button');
      b.textContent = i + 1;
      if (solvedByLevel[i]) b.classList.add('done');
      b.onclick = () => { loadLevel(i); toggleLevelSelect(false); };
      el.appendChild(b);
    });
  }
  function toggleLevelSelect(force) {
    const el = document.getElementById('levelSelect');
    const show = force !== undefined ? force : el.style.display !== 'grid';
    if (show) buildLevelSelect();
    el.style.display = show ? 'grid' : 'none';
  }

  // ---------- Input ----------
  window.addEventListener('keydown', e => {
    const map = {
      ArrowUp: [0, -1], KeyW: [0, -1],
      ArrowDown: [0, 1], KeyS: [0, 1],
      ArrowLeft: [-1, 0], KeyA: [-1, 0],
      ArrowRight: [1, 0], KeyD: [1, 0]
    };
    if (map[e.code]) { e.preventDefault(); tryMove(...map[e.code]); }
    if (e.code === 'KeyZ') undo();
    if (e.code === 'KeyR') resetLevel();
  });

  document.getElementById('undoBtn').onclick = undo;
  document.getElementById('resetBtn').onclick = resetLevel;
  document.getElementById('hintBtn').onclick = hint;
  document.getElementById('levelsBtn').onclick = () => toggleLevelSelect();
  document.getElementById('nextBtn').onclick = () => {
    if (mode === 'endless') newEndlessLevel();
    else if (currentLevel < LEVELS.length - 1) loadLevel(currentLevel + 1);
  };
  document.getElementById('endlessBtn').onclick = () => {
    toggleLevelSelect(false);
    newEndlessLevel(document.getElementById('difficultySelect').value);
  };
  document.getElementById('rerollBtn').onclick = () => newEndlessLevel();
  document.getElementById('difficultySelect').onchange = (e) => newEndlessLevel(e.target.value);

  // touch swipe
  let touchStart = null;
  canvas.addEventListener('touchstart', e => {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  canvas.addEventListener('touchend', e => {
    if (!touchStart) return;
    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    if (Math.abs(dx) > Math.abs(dy)) {
      if (Math.abs(dx) > 20) tryMove(dx > 0 ? 1 : -1, 0);
    } else {
      if (Math.abs(dy) > 20) tryMove(0, dy > 0 ? 1 : -1);
    }
    touchStart = null;
  });

  // ---------- Boot ----------
  loadLevel(0);
</script>

<!-- Firebase leaderboard (optional) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getFirestore, collection, addDoc, serverTimestamp,
    query, orderBy, limit, getDocs
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  // ---- REPLACE WITH YOUR FIREBASE CONFIG ----
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT_ID.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };
  // ------------------------------------------

  let db = null;
  try {
    if (!firebaseConfig.apiKey.startsWith('YOUR_')) {
      const app = initializeApp(firebaseConfig);
      db = getFirestore(app);
    }
  } catch (e) {
    console.warn('Firebase not configured yet:', e);
  }

  window.submitScore = async function(name, totalMoves) {
    if (!db) throw new Error('Firebase not configured');
    await addDoc(collection(db, 'scores'), {
      name: String(name).slice(0, 16),
      totalMoves: Math.round(totalMoves),
      createdAt: serverTimestamp()
    });
  };

  window.loadLeaderboard = async function() {
    if (!db) throw new Error('Firebase not configured');
    const q = query(collection(db, 'scores'), orderBy('totalMoves', 'asc'), limit(10));
    const snap = await getDocs(q);
    return snap.docs.map(d => d.data());
  };
</script>
